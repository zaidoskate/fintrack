<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FinTrack — Dirección visual "Glass Ledger"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #fa686fff;
    --brand-dim: rgba(250, 104, 111, 0.35);
    --brand-deep: #7A2530;
    --bg-base: #0F0A0B;
    --surface-glass: rgba(255, 255, 255, 0.06);
    --border-glass: rgba(255, 255, 255, 0.12);
    --verde: #34D399;
    --amarillo: #FBBF24;
    --rojo: #EF4444;
    --text-primary: #F5F5F7;
    --text-secondary: rgba(245, 245, 247, 0.6);
    --text-muted: rgba(245, 245, 247, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 24px 80px;
    position: relative;
    overflow-x: hidden;
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob-coral { width: 420px; height: 420px; background: var(--brand); top: -120px; left: -100px; }
  .blob-deep { width: 460px; height: 460px; background: var(--brand-deep); bottom: -160px; right: -140px; opacity: 0.4; }

  .content { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }

  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), #ff8a8f);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: #1a0a0b;
  }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }

  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; margin-bottom: 6px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }

  .card {
    position: relative;
    background: var(--surface-glass);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--border-glass);
    border-radius: 22px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -40%; left: -20%;
    width: 160%; height: 160%;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.22;
    z-index: -1;
  }
  .card-amber::before { background: var(--amarillo); }
  .card-rojo::before { background: var(--rojo); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
  .card-name { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 16px; }
  .chip { width: 34px; height: 24px; border-radius: 5px; background: linear-gradient(135deg, #d4af6a, #f0d78c); }

  .card-number { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 0.08em; color: var(--text-secondary); margin-bottom: 22px; }

  .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .disponible-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 4px; }
  .disponible-monto { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 100px;
    font-size: 12px; font-weight: 600;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill-amber { background: rgba(251, 191, 36, 0.15); color: var(--amarillo); }
  .pill-amber .pill-dot { background: var(--amarillo); box-shadow: 0 0 8px var(--amarillo); }
  .pill-rojo { background: rgba(239, 68, 68, 0.15); color: var(--rojo); }
  .pill-rojo .pill-dot { background: var(--rojo); box-shadow: 0 0 8px var(--rojo); }

  .fab {
    position: fixed;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--brand);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px var(--brand-dim);
    z-index: 2;
  }
  .fab svg { width: 24px; height: 24px; }
</style>
</head>
<body>
  <div class="blob blob-coral"></div>
  <div class="blob blob-deep"></div>

  <div class="content">
    <div class="header">
      <div class="logo">F</div>
      <div class="brand-name">FinTrack</div>
    </div>

    <h1>Tus tarjetas</h1>
    <p class="subtitle">Corte y disponible, al vuelo</p>

    <div class="card card-amber">
      <div class="card-top">
        <span class="card-name">BBVA Platino</span>
        <div class="chip"></div>
      </div>
      <div class="card-number">•••• •••• •••• 4821</div>
      <div class="card-bottom">
        <div>
          <div class="disponible-label">Disponible</div>
          <div class="disponible-monto">$5,750</div>
        </div>
        <div class="pill pill-amber"><span class="pill-dot"></span>Aún puedes gastar</div>
      </div>
    </div>

    <div class="card card-rojo">
      <div class="card-top">
        <span class="card-name">Santander Free</span>
        <div class="chip"></div>
      </div>
      <div class="card-number">•••• •••• •••• 1190</div>
      <div class="card-bottom">
        <div>
          <div class="disponible-label">Disponible</div>
          <div class="disponible-monto">$200</div>
        </div>
        <div class="pill pill-rojo"><span class="pill-dot"></span>Te excediste</div>
      </div>
    </div>
  </div>

  <div class="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a0a0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </div>
</body>
</html>
